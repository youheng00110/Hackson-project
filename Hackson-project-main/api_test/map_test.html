<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度地图 API 测试 - 浏览器端</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100%;
            height: 70vh;
        }
        .control-panel {
            padding: 20px;
            background-color: #f5f5f5;
        }
        .input-group {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 80px;
            font-weight: bold;
        }
        input {
            width: 300px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 20px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 15px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
    <!-- 百度地图 JavaScript API -->
    <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=PQs7CZEekMDpIjULh5eaG9OhuhNv1vsm"></script>
</head>
<body>
    <div id="container"></div>
    
    <div class="control-panel">
        <h2>百度地图浏览器端 API 测试</h2>
        
        <div class="input-group">
            <label>起点：</label>
            <input type="text" id="startPoint" placeholder="例如：北京天安门" value="北京天安门">
        </div>
        
        <div class="input-group">
            <label>终点：</label>
            <input type="text" id="endPoint" placeholder="例如：北京西站" value="北京西站">
        </div>
        
        <div class="input-group">
            <label>出行方式：</label>
            <select id="travelMode" style="width: 150px; padding: 5px;">
                <option value="BMAP_TRANSIT_POLICY_LEAST_TIME">公交-最短时间</option>
                <option value="BMAP_DRIVING_POLICY_LEAST_TIME">驾车-最短时间</option>
                <option value="walking">步行</option>
                <option value="riding">骑行</option>
            </select>
        </div>
        
        <div>
            <button onclick="searchRoute()">路线规划</button>
            <button onclick="clearRoute()">清除路线</button>
            <button onclick="addMarker()">添加标记点</button>
            <button onclick="clearMap()">清空地图</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script type="text/javascript">
        // 检查百度地图 API 是否加载成功
        if (typeof BMap === 'undefined') {
            document.getElementById("container").innerHTML = 
                '<div style="padding: 50px; text-align: center; color: red; font-size: 18px;">' +
                '❌ 百度地图 API 加载失败！<br><br>' +
                '可能的原因：<br>' +
                '1. API Key 无效或已过期<br>' +
                '2. API Key 的 IP 白名单配置不正确<br>' +
                '3. 网络连接问题<br>' +
                '4. 浏览器控制台可能有更详细的错误信息<br><br>' +
                '请按 F12 打开开发者工具查看 Console 控制台的错误信息' +
                '</div>';
            console.error('百度地图 API (BMap) 未定义，请检查 API Key 和网络连接');
        }
        
        // 初始化地图
        var map = new BMap.Map("container");
        var point = new BMap.Point(116.404, 39.915); // 北京市中心
        map.centerAndZoom(point, 12);
        map.enableScrollWheelZoom(true); // 开启鼠标滚轮缩放
        
        // 添加地图控件
        map.addControl(new BMap.NavigationControl());
        map.addControl(new BMap.ScaleControl());
        map.addControl(new BMap.OverviewMapControl());
        map.addControl(new BMap.MapTypeControl());
        
        // 地图加载完成事件
        map.addEventListener("tilesloaded", function(){
            console.log("✓ 地图加载成功！");
            document.getElementById("result").innerHTML = 
                '<span style="color: green;">✓ 地图加载成功！可以开始使用</span>';
        });
        
        var markers = []; // 存储标记点
        var routeOverlays = []; // 存储路线覆盖物
        
        // 地图点击事件
        map.addEventListener("click", function(e){
            var pt = e.point;
            document.getElementById("result").innerHTML = 
                "点击位置：<br>经度：" + pt.lng + "<br>纬度：" + pt.lat;
        });
        
        // 路线规划
        function searchRoute() {
            var start = document.getElementById("startPoint").value;
            var end = document.getElementById("endPoint").value;
            var mode = document.getElementById("travelMode").value;
            
            if (!start || !end) {
                alert("请输入起点和终点！");
                return;
            }
            
            clearRoute(); // 清除之前的路线
            
            // 创建地址解析器实例
            var myGeo = new BMap.Geocoder();
            var startPoint, endPoint;
            
            // 解析起点地址
            myGeo.getPoint(start, function(startPt){
                if (startPt) {
                    startPoint = startPt;
                    
                    // 解析终点地址
                    myGeo.getPoint(end, function(endPt){
                        if (endPt) {
                            endPoint = endPt;
                            
                            // 根据出行方式进行路线规划
                            if (mode === "walking") {
                                searchWalkingRoute(startPoint, endPoint);
                            } else if (mode === "riding") {
                                searchRidingRoute(startPoint, endPoint);
                            } else if (mode.includes("DRIVING")) {
                                searchDrivingRoute(startPoint, endPoint, eval(mode));
                            } else {
                                searchTransitRoute(startPoint, endPoint, eval(mode));
                            }
                            
                            // 调整地图视野
                            map.setViewport([startPoint, endPoint]);
                        } else {
                            alert("终点地址解析失败！");
                        }
                    }, "");
                } else {
                    alert("起点地址解析失败！");
                }
            }, "");
        }
        
        // 驾车路线规划
        function searchDrivingRoute(start, end, policy) {
            var driving = new BMap.DrivingRoute(map, {
                policy: policy,
                onSearchComplete: function(results){
                    if (driving.getStatus() == BMAP_STATUS_SUCCESS){
                        var plan = results.getPlan(0);
                        var route = plan.getRoute(0);
                        
                        // 显示路线
                        var pts = route.getPath();
                        var polyline = new BMap.Polyline(pts, {
                            strokeColor: "blue",
                            strokeWeight: 5,
                            strokeOpacity: 0.7
                        });
                        map.addOverlay(polyline);
                        routeOverlays.push(polyline);
                        
                        // 添加起终点标记
                        addStartEndMarkers(start, end);
                        
                        // 显示结果
                        document.getElementById("result").innerHTML = 
                            "驾车路线：<br>" +
                            "距离：" + plan.getDistance(true) + "<br>" +
                            "时间：" + plan.getDuration(true);
                    } else {
                        alert("路线规划失败！");
                    }
                }
            });
            driving.search(start, end);
        }
        
        // 公交路线规划
        function searchTransitRoute(start, end, policy) {
            var transit = new BMap.TransitRoute(map, {
                policy: policy,
                onSearchComplete: function(results){
                    if (transit.getStatus() == BMAP_STATUS_SUCCESS){
                        var plan = results.getPlan(0);
                        
                        // 绘制路线（简化版）
                        addStartEndMarkers(start, end);
                        
                        // 显示结果
                        var info = "公交路线：<br>" +
                            "距离：" + plan.getDistance(true) + "<br>" +
                            "时间：" + plan.getDuration(true) + "<br>" +
                            "方案：" + plan.getDescription(true);
                        document.getElementById("result").innerHTML = info;
                    } else {
                        alert("路线规划失败！");
                    }
                }
            });
            transit.search(start, end);
        }
        
        // 步行路线规划
        function searchWalkingRoute(start, end) {
            var walking = new BMap.WalkingRoute(map, {
                onSearchComplete: function(results){
                    if (walking.getStatus() == BMAP_STATUS_SUCCESS){
                        var plan = results.getPlan(0);
                        var route = plan.getRoute(0);
                        
                        // 显示路线
                        var pts = route.getPath();
                        var polyline = new BMap.Polyline(pts, {
                            strokeColor: "green",
                            strokeWeight: 4,
                            strokeOpacity: 0.7
                        });
                        map.addOverlay(polyline);
                        routeOverlays.push(polyline);
                        
                        // 添加起终点标记
                        addStartEndMarkers(start, end);
                        
                        // 显示结果
                        document.getElementById("result").innerHTML = 
                            "步行路线：<br>" +
                            "距离：" + plan.getDistance(true) + "<br>" +
                            "时间：" + plan.getDuration(true);
                    } else {
                        alert("路线规划失败！");
                    }
                }
            });
            walking.search(start, end);
        }
        
        // 骑行路线规划
        function searchRidingRoute(start, end) {
            var riding = new BMap.RidingRoute(map, {
                onSearchComplete: function(results){
                    if (riding.getStatus() == BMAP_STATUS_SUCCESS){
                        var plan = results.getPlan(0);
                        var route = plan.getRoute(0);
                        
                        // 显示路线
                        var pts = route.getPath();
                        var polyline = new BMap.Polyline(pts, {
                            strokeColor: "orange",
                            strokeWeight: 4,
                            strokeOpacity: 0.7
                        });
                        map.addOverlay(polyline);
                        routeOverlays.push(polyline);
                        
                        // 添加起终点标记
                        addStartEndMarkers(start, end);
                        
                        // 显示结果
                        document.getElementById("result").innerHTML = 
                            "骑行路线：<br>" +
                            "距离：" + plan.getDistance(true) + "<br>" +
                            "时间：" + plan.getDuration(true);
                    } else {
                        alert("路线规划失败！");
                    }
                }
            });
            riding.search(start, end);
        }
        
        // 添加起终点标记
        function addStartEndMarkers(start, end) {
            var startMarker = new BMap.Marker(start);
            var endMarker = new BMap.Marker(end);
            
            startMarker.setLabel(new BMap.Label("起点", {offset: new BMap.Size(10, -10)}));
            endMarker.setLabel(new BMap.Label("终点", {offset: new BMap.Size(10, -10)}));
            
            map.addOverlay(startMarker);
            map.addOverlay(endMarker);
            
            routeOverlays.push(startMarker);
            routeOverlays.push(endMarker);
        }
        
        // 清除路线
        function clearRoute() {
            routeOverlays.forEach(function(overlay){
                map.removeOverlay(overlay);
            });
            routeOverlays = [];
            document.getElementById("result").innerHTML = "";
        }
        
        // 添加标记点
        function addMarker() {
            var center = map.getCenter();
            var marker = new BMap.Marker(center);
            map.addOverlay(marker);
            markers.push(marker);
            
            // 添加点击事件
            marker.addEventListener("click", function(){
                var infoWindow = new BMap.InfoWindow("标记点位置：<br>经度：" + center.lng + "<br>纬度：" + center.lat);
                map.openInfoWindow(infoWindow, center);
            });
            
            document.getElementById("result").innerHTML = 
                "添加标记点成功！<br>经度：" + center.lng + "<br>纬度：" + center.lat;
        }
        
        // 清空地图
        function clearMap() {
            map.clearOverlays();
            markers = [];
            routeOverlays = [];
            document.getElementById("result").innerHTML = "地图已清空";
        }
    </script>
</body>
</html>
